name: live-completion-adapter-review-001

on:
  push:
    branches:
      - live-completion-adapter-review-001-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Review pressure
        run: python -m unittest -v tests.runtime.test_live_completion_adapter_review_001
