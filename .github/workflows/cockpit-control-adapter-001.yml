name: COCKPIT_CONTROL_ADAPTER_001

on:
  pull_request:
    paths:
      - "src/cockpit/control_adapter.py"
      - "src/cockpit/observer/control_live.mjs"
      - "src/cockpit/observer/app.mjs"
      - "src/cockpit/observer/index.html"
      - "src/cockpit/observer/styles.css"
      - "tests/runtime/test_cockpit_control_adapter.py"
      - "tests/cockpit/test_control_adapter.mjs"
      - "docs/candidates/cockpit_control_adapter_v0/**"
      - ".github/workflows/cockpit-control-adapter-001.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Cockpit control adapter
        run: python -m py_compile src/cockpit/control_adapter.py tests/runtime/test_cockpit_control_adapter.py
      - name: Check Cockpit control module
        run: node --check src/cockpit/observer/control_live.mjs
      - name: Cockpit control adapter pressure
        run: python -m unittest tests.runtime.test_cockpit_control_adapter -v
      - name: Cockpit control UI pressure
        run: node --test tests/cockpit/test_control_adapter.mjs
      - name: Wake source regression
        run: python -m unittest tests.runtime.test_wake_source -v
      - name: Bounded reentry regression
        run: python -m unittest tests.runtime.test_bounded_reentry -v
      - name: Preparation assignment regression
        run: python -m unittest tests.runtime.test_preparation_assignment -v
      - name: Development horizon regression
        run: python -m unittest tests.runtime.test_development_horizon_projection -v
      - name: Live runtime projection regression
        run: python -m unittest tests.runtime.test_live_runtime_projection -v
      - name: Existing Cockpit observer regression
        run: node --test tests/cockpit/test_observer.mjs
