name: live-completion-evidence-001-repair-v1

on:
  push:
    branches:
      - live-completion-evidence-001-repair-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-pressure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Candidate and integration tests
        run: |
          python -m unittest -v tests.runtime.test_live_completion_evidence_v1
          python -m unittest -v tests.runtime.test_live_completion_evidence_v1_integration
      - name: Produce deterministic candidate qualification evidence
        run: |
          python tools/run_live_completion_evidence_pressure_v1.py --output candidate-evidence-a.json
          python tools/run_live_completion_evidence_pressure_v1.py --output candidate-evidence-b.json
          cmp candidate-evidence-a.json candidate-evidence-b.json
          cat candidate-evidence-a.json
      - name: Upload candidate qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-completion-evidence-001-repair-v1-candidate
          path: candidate-evidence-a.json
      - name: Produce deterministic final bridge evidence
        run: |
          python tools/run_live_completion_evidence_repair_final_v1.py --output final-evidence-a.json
          python tools/run_live_completion_evidence_repair_final_v1.py --output final-evidence-b.json
          cmp final-evidence-a.json final-evidence-b.json
          cat final-evidence-a.json
      - name: Upload final bridge evidence
        uses: actions/upload-artifact@v4
        with:
          name: live-completion-evidence-001-repair-v1-final
          path: final-evidence-a.json
