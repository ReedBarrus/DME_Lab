name: LANE_LIFECYCLE_DISPOSITION_001_SYNTHETIC_PRESSURE

on:
  pull_request:
    paths:
      - "tools/lane_lifecycle_disposition_v0.py"
      - "tools/lane_lifecycle_disposition_oracle_v0.py"
      - "tools/run_lane_lifecycle_disposition_pressure_v0.py"
      - "fixtures/lane_lifecycle_disposition_v0/**"
      - "schemas/lane_lifecycle_pressure_*"
      - ".github/workflows/lane-lifecycle-disposition-001-pressure.yml"
  workflow_dispatch:

jobs:
  synthetic-pressure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up frozen Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile frozen apparatus
        run: |
          python -m py_compile \
            tools/lane_lifecycle_disposition_v0.py \
            tools/lane_lifecycle_disposition_oracle_v0.py \
            tools/run_lane_lifecycle_disposition_pressure_v0.py

      - name: Execute frozen synthetic lifecycle pressure exactly once
        run: python tools/run_lane_lifecycle_disposition_pressure_v0.py --freeze fixtures/lane_lifecycle_disposition_v0/EXECUTION_FREEZE_001.json --output pressure_result.json

      - name: Upload complete or partial execution receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-lifecycle-synthetic-pressure-001
          path: pressure_result.json
          if-no-files-found: warn
