name: PRIMARY_ECOLOGY_GRAMMAR_001_INTEGRATION_001

on:
  push:
    branches:
      - primary-ecology-integration-001
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-pressure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact integration descendant
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile ecology and integration apparatus
        run: |
          python -m py_compile \
            tools/primary_ecology_v0.py \
            tests/runtime/test_primary_ecology_v0.py \
            tests/runtime/test_primary_ecology_integration_v0.py

      - name: Fresh PRIMARY_ECOLOGY_GRAMMAR_001 qualification
        run: python -m unittest tests.runtime.test_primary_ecology_v0 -v

      - name: Regenerate descendant ecology qualification evidence
        run: python -m tools.primary_ecology_v0 --output /tmp/PRIMARY_ECOLOGY_GRAMMAR_001_RESULT.json

      - name: Verify retained ecology qualification evidence
        run: diff -u docs/candidates/primary_ecology_v0/QUALIFICATION_EVIDENCE_001.json /tmp/PRIMARY_ECOLOGY_GRAMMAR_001_RESULT.json

      - name: Execute Y1-Y3 and Y5 integration pressure
        run: python -m unittest tests.runtime.test_primary_ecology_integration_v0 -v

      - name: Compile adjacent current-main apparatus
        run: |
          python -m py_compile \
            tools/two_lane_coordination_v0.py \
            tools/two_lane_coordination_v1.py \
            tools/lane_b_successor_engagement_v0.py \
            tools/lane_b_successor_engagement_repressure_v1.py \
            tools/lane_lifecycle_disposition_v0.py \
            tools/lane_lifecycle_disposition_oracle_v0.py \
            tools/run_lane_lifecycle_disposition_pressure_v0.py \
            tests/runtime/test_two_lane_coordination_v0.py \
            tests/runtime/test_quiet_peer_coordination_v1.py \
            tests/runtime/test_lane_b_successor_engagement_v0.py \
            tests/runtime/test_lane_b_successor_engagement_repressure_v1.py

      - name: Y4 two-lane coordination regression
        run: python -m unittest tests.runtime.test_two_lane_coordination_v0 -v

      - name: Y4 quiet-peer coordination regression
        run: python -m unittest tests.runtime.test_quiet_peer_coordination_v1 -v

      - name: Y4 Lane-B historical harness precondition remains current-main blocked
        run: |
          test ! -e coordination/lane_manifest.json
          if git cat-file -e f36261e17790b853a91c81bc2f7d0e63e8ee8436:coordination/lane_manifest.json 2>/dev/null; then
            echo "target main unexpectedly contains coordination/lane_manifest.json"
            exit 1
          fi
          git diff --quiet f36261e17790b853a91c81bc2f7d0e63e8ee8436..HEAD -- \
            tools/lane_b_successor_engagement_v0.py \
            tools/lane_b_successor_engagement_repressure_v1.py \
            tests/runtime/test_lane_b_successor_engagement_v0.py \
            tests/runtime/test_lane_b_successor_engagement_repressure_v1.py \
            schemas/lane_engagement_binding_v0.schema.json \
            coordination/predecessor_fences/LANE_B_LEGACY_INSTANCE_001.json

      - name: Y4 Lane-B successor v0 preserves target-main administrative block
        run: |
          set +e
          python -m unittest tests.runtime.test_lane_b_successor_engagement_v0 -v > /tmp/lane_b_v0.log 2>&1
          rc=$?
          set -e
          cat /tmp/lane_b_v0.log
          test "$rc" -ne 0
          grep -q "FileNotFoundError" /tmp/lane_b_v0.log
          grep -q "coordination/lane_manifest.json" /tmp/lane_b_v0.log

      - name: Y4 Lane-B successor repressure preserves target-main administrative block
        run: |
          set +e
          python -m unittest tests.runtime.test_lane_b_successor_engagement_repressure_v1 -v > /tmp/lane_b_repressure.log 2>&1
          rc=$?
          set -e
          cat /tmp/lane_b_repressure.log
          test "$rc" -ne 0
          grep -q "FileNotFoundError" /tmp/lane_b_repressure.log
          grep -q "coordination/lane_manifest.json" /tmp/lane_b_repressure.log

      - name: Y4 lane lifecycle synthetic pressure
        run: |
          python tools/run_lane_lifecycle_disposition_pressure_v0.py \
            --freeze fixtures/lane_lifecycle_disposition_v0/EXECUTION_FREEZE_001.json \
            --output /tmp/lane_lifecycle_pressure_result.json
